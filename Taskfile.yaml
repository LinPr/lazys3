# https://taskfile.dev

version: "3"
silent: true

# Every build is static: CGO_ENABLED=0 makes the net and os/user packages use
# their pure-Go implementations instead of the libc-backed cgo ones, which is
# what otherwise produces a binary that needs the build machine's glibc (a
# released binary failed on older distributions with "GLIBC_2.34 not found").
env:
  CGO_ENABLED: '0'

tasks:
  default:
    cmds:
      - ./lazys3 --debug
    interactive: true
    desc: Run
    deps:
      - build

  build:
    desc: Build a statically linked binary
    cmds:
      # -trimpath keeps the build path out of the binary (reproducible, and no
      # local checkout paths in stack traces).
      # CGO_ENABLED is set inline as well as in the global env: an exported
      # CGO_ENABLED=1 in the caller's shell wins over a task-level env var, and
      # that is how a dynamic release slipped through before.
      - CGO_ENABLED=0 go build -trimpath -ldflags "-X github.com/LinPr/lazys3/cmd.Version=$(git describe --tags --always --dirty)" .
      # Verify instead of assuming: CGO can be re-enabled by an env var in the
      # caller's shell, and a dynamically linked binary only fails much later,
      # on somebody else's distribution.
      - |
        if [ "$(go env GOOS)" = "linux" ]; then
          if ! file lazys3 | grep -q 'statically linked'; then
            echo "error: lazys3 is not statically linked" >&2
            file lazys3 >&2
            exit 1
          fi
        fi

  build-all:
    desc: Cross-compile every release target into dist/ (all static)
    cmds:
      - mkdir -p dist
      - |
        VERSION="$(git describe --tags --always --dirty)"
        for target in \
          linux/amd64 linux/arm64 \
          darwin/amd64 darwin/arm64 \
          windows/amd64 windows/arm64; do
          GOOS="${target%/*}"; GOARCH="${target#*/}"
          out="dist/lazys3-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && out="${out}.exe"
          echo "building ${out}"
          CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
            -ldflags "-s -w -X github.com/LinPr/lazys3/cmd.Version=${VERSION}" -o "$out" . || exit 1
        done
      # Linux: must be fully static. macOS: never fully static (the platform
      # requires its system libraries), so check that nothing outside
      # /usr/lib and /System/Library is linked. PE artifacts are left to CI,
      # which can inspect them natively.
      - |
        fail=0
        for bin in dist/*linux*; do
          if ! file "$bin" | grep -q 'statically linked'; then
            echo "error: $bin is not statically linked" >&2
            file "$bin" >&2
            fail=1
          fi
        done
        exit $fail
      - python3 scripts/check-macho-dylibs.py dist/lazys3-darwin-*

  lint:
    desc: Run base linters
    cmds:
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m
    env:
      GOEXPERIMENT: null

  lint-fix:
    desc: Run base linters and fix issues
    cmds:
      - golangci-lint run --path-mode=abs --config=".golangci.yml" --timeout=5m --fix
    env:
      GOEXPERIMENT: null

  test:
    desc: Run unit tests (alias for test-unit)
    deps:
      - test-unit

  test-unit:
    cmds:
      - go test -v $(go list ./... | grep -v /e2e)
    desc: Run unit tests (excludes e2e package)

  test-e2e:
    cmds:
      - go test -v -tags=e2e ./e2e/...
    desc: Run e2e tests against in-process gofakes3

  test-e2e-real:
    desc: Run e2e tests against a real S3-compatible service via a shared config profile
    cmds:
      - LAZYS3_E2E_REAL=oss go test -v -tags=e2e ./e2e/...

  fmt:
    desc: Run go fmt
    cmds:
      - go fmt ./...

  check-nerd-font:
    cmds:
      - nerdfix check $(fd --extension go)
    desc: Find broken nerdfont characters

  fix-nerd-font:
    cmds:
      - nerdfix fix --format=json $(fd --extension go)
    desc: Fix broken nerdfont icons

  docs-prepare:
    cmds:
      - cd docs && pnpm i

  docs-dev:
    cmds:
      - cd docs && pnpm dev
    desc: Start docs server

  docs-build:
    cmds:
      - task: docs-prepare
      - cd docs && pnpm build
    desc: Run docs production build

  docs-preview:
    cmds:
      - task: docs-build
      - cd docs && pnpm preview
    desc: Preview docs production build
